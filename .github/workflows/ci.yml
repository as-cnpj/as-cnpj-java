name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  java-17:
    name: Java 17
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compile main
        run: bash scripts/test.sh
